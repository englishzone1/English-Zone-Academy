name: QA dist
on:
  push:
    branches: [qa-dist]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download audio, transcribe, print
        run: |
          set -e
          pip install -q openai-whisper >/dev/null 2>&1 || true
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
          for pair in "r78a:1fDOCLhaMx2RzZ-YHzknPKo4wJearmzyA" "r78b:1khozT11YO20Tn54wCgM7ASGro2Kb-kz8"; do
            n=${pair%%:*}; id=${pair##*:}
            curl -sSL -o "$n.mp3" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            echo "INFO $n $(stat -c%s $n.mp3) $(file -b $n.mp3 | cut -c1-60)"
            whisper "$n.mp3" --model small --language en --output_format txt --output_dir . >/dev/null 2>&1 || true
            sed 's/^/TXT /' "$n.txt" || true
            if file -b $n.mp3 | grep -qi audio; then base64 -w 3000 "$n.mp3"; fi | awk -v n="$n" '{printf "AUD_%s_%05d %s\n", n, NR, $0}'
          done
