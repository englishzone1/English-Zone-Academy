name: QA dist
on:
  push:
    branches: [qa-dist]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Read student book track numbers per page
        run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          curl -sSL -o sb.pdf "https://drive.usercontent.google.com/download?id=15g3BEu_D8Z11imhX8ZJPqcgSyGDnuZKB&export=download&confirm=t"
          if file -b sb.pdf | grep -qi html; then u=$(grep -oE 'name="uuid" value="[^"]+"' sb.pdf | sed 's/.*value="//;s/"//'); curl -sSL -o sb.pdf "https://drive.usercontent.google.com/download?id=15g3BEu_D8Z11imhX8ZJPqcgSyGDnuZKB&export=download&confirm=t&uuid=$u"; fi
          echo "INFO $(stat -c%s sb.pdf) $(file -b sb.pdf | cut -c1-60)"
          n=$(pdfinfo sb.pdf | awk '/^Pages/{print $2}'); echo "PAGES $n"
          for p in $(seq 1 $n); do
            t=$(pdftotext -f $p -l $p -layout sb.pdf - 2>/dev/null)
            head=$(echo "$t" | grep -oE '\b(1[0-2]|[1-9])[AB]\b|Practical English [1-6]?|PRACTICAL ENGLISH|Episode [1-6]|Revise and Check|REVISE AND CHECK' | sort -u | tr '\n' ',')
            tr=$(echo "$t" | grep -oE '\b(1[0-2]|[1-9])\.[0-9]{2}\b' | sort -u -V | tr '\n' ' ')
            echo "PG $p | $head | $tr"
          done
