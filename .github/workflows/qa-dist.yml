name: QA dist
on:
  push:
    branches: [qa-dist]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: qa-dist
          path: qa
      - name: Download curriculum audio, compress, commit to main
        run: |
          set -e
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
          out=site/public/curriculum/ef5-a1
          mkdir -p $out
          ok=0; bad=0
          while read num id; do
            [ -z "$num" ] && continue
            curl -sSL --retry 3 -o in.mp3 "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || true
            if file -b in.mp3 | grep -qi audio; then
              ffmpeg -loglevel error -y -i in.mp3 -ac 1 -ar 22050 -b:a 48k "$out/$num.mp3" && ok=$((ok+1))
            else
              echo "BAD $num $(file -b in.mp3 | cut -c1-50)"; bad=$((bad+1))
            fi
          done < qa/tracks.txt
          echo "DONE ok=$ok bad=$bad size=$(du -sh $out | cut -f1)"
          cd site
          git config user.name "English Zone bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/curriculum
          git commit -q -m "Curriculum audio: Oxford English File A1 recordings" || true
          git push -q origin HEAD:main
