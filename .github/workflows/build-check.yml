# فحص البناء فقط (لا ينشر شيئًا): يتأكد أن الموقع يُبنى بلا أخطاء قبل النشر
name: Build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build
