# التقاط صور الموقع للإعلان (يعمل يدويًا أو عند الرفع إلى فرع shots)
name: Site screenshots
on:
  push:
    branches: [shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-homework
        run: |
          curl -sL -o /tmp/hw.html -w "status %{http_code} size %{size_download}\n" https://english-zone-academy.englishzoneabc123.workers.dev/homework/index.html
          grep -c "window.self === window.top" /tmp/hw.html || true
          grep -c 'id="sn"' /tmp/hw.html || true
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: cp -r tools /tmp/pw/ && cp tools/assist.cjs /tmp/pw/ && cd /tmp/pw && sleep 120 && node assist.cjs
      # الصور تُحفظ في فرع منفصل اسمه shots-output
      - run: |
          cd /tmp/pw/shots
          git init -q -b shots-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Site screenshots"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots-output
